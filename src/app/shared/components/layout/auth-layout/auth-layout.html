<div class="min-h-screen flex bg-slate-50">
  <!-- Left Column: Illustration (Hidden on mobile) -->
  <div class="hidden lg:flex lg:w-1/2 bg-indigo-950 text-white flex-col justify-between p-12 relative overflow-hidden">
    <!-- Glow effects -->
    <div class="absolute -top-12 -left-12 w-64 h-64 bg-indigo-500/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-12 -right-12 w-64 h-64 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>
    
    <!-- Branding Header -->
    <a routerLink="/" class="flex items-center gap-2.5 z-10 cursor-pointer group w-fit">
      <div class="w-9 h-9 bg-indigo-600 rounded-lg flex items-center justify-center shadow-lg group-hover:scale-105 transition-transform duration-200">
        <svg lucideWallet class="w-4.5 h-4.5 text-white"></svg>
      </div>
      <span class="text-lg font-bold tracking-tight text-white">FinanceTracker <span class="text-indigo-400 font-extrabold">Pro</span></span>
    </a>

    <!-- Center Content: Illustration & Tagline -->
    <div class="flex flex-col items-center justify-center flex-1 max-w-md mx-auto z-10 py-12">
      <div class="w-full aspect-square flex items-center justify-center mb-8 hover:scale-[1.01] transition-transform duration-300 animate-float">
        <img src="images/auth-illustration.png" alt="FinanceTracker Secure Access" class="w-full h-auto object-contain">
      </div>
      <h2 class="text-2xl font-black uppercase text-center tracking-tight leading-tight">
        Master Your Financial Future
      </h2>
      <p class="text-indigo-200 text-sm text-center mt-3 leading-relaxed">
        Track every dollar, manage category budgets, and leverage premium AI forecasts to save more and spend smarter.
      </p>
    </div>

    <!-- Bottom footer/legal -->
    <div class="text-indigo-400 text-xs z-10">
      &copy; 2026 FinanceTracker Pro. All rights reserved.
    </div>
  </div>

  <!-- Right Column: Form Container (Always visible) -->
  <div class="w-full lg:w-1/2 flex items-center justify-center p-4 sm:p-12 md:p-16">
    <div class="w-full max-w-md bg-white sm:shadow-2xl sm:shadow-slate-900/5 sm:border sm:border-slate-100/80 rounded-3xl p-8 sm:p-10 transition-all duration-300">
      <!-- Mobile Logo Header (visible on screens < lg) -->
      <div class="flex flex-col items-center mb-8 lg:hidden">
        <a routerLink="/" class="flex items-center gap-2.5 cursor-pointer">
          <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center shadow-lg shadow-indigo-600/20">
            <svg lucideWallet class="w-5 h-5 text-white"></svg>
          </div>
          <span class="text-xl font-bold tracking-tight text-slate-900">FinanceTracker <span class="text-indigo-600 font-extrabold">Pro</span></span>
        </a>
      </div>
      
      <!-- Child Route Form Outlet -->
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
