<div class="register-content">
  <div class="register-header text-left mb-6">
    <h3 class="text-3xl font-extrabold text-slate-900 tracking-tight">Create Account</h3>
    <p class="text-slate-500 text-sm mt-2">Get started with FinanceTracker Pro today</p>
  </div>

  @if (errorMessage()) {
    <div class="bg-red-50 text-red-600 text-sm p-3.5 rounded-xl border border-red-200 mb-6">
      {{ errorMessage() }}
    </div>
  }

  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="register-body flex flex-col gap-4">
    <app-input class="block" label="Full Name" placeholder="Enter your name" [error]="getErrorMessage('name')"
      (valueChange)="registerForm.get('name')?.setValue($event)"></app-input>

    <app-input class="block" label="Email Address" placeholder="Enter your email" type="email"
      [error]="getErrorMessage('email')" (valueChange)="registerForm.get('email')?.setValue($event)"></app-input>

    <app-input class="block" label="Password" placeholder="Enter your password (min 6 chars)" type="password"
      [error]="getErrorMessage('password')"
      (valueChange)="registerForm.get('password')?.setValue($event)"></app-input>

    <app-input class="block" label="Confirm Password" placeholder="Confirm your password" type="password"
      [error]="getErrorMessage('confirmPassword')"
      (valueChange)="registerForm.get('confirmPassword')?.setValue($event)"></app-input>

    <app-button type="submit" [fullWidth]="true" [disabled]="isLoading()" class="mt-2 cursor-pointer">
      {{ isLoading() ? 'Creating account...' : 'Get Started' }}
    </app-button>
  </form>

  <div class="register-footer mt-8 text-center">
    <p class="text-sm text-slate-500">
      Already have an account?
      <a routerLink="/auth/login" class="text-indigo-600 hover:text-indigo-750 hover:underline font-semibold cursor-pointer">
        Sign In
      </a>
    </p>
  </div>
</div>
