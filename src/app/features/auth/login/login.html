<div class="login-content">
  <div class="login-header text-left mb-6">
    <h3 class="text-3xl font-extrabold text-slate-900 tracking-tight">Welcome Back</h3>
    <p class="text-slate-500 text-sm mt-2">Enter your credentials to access your dashboard</p>
  </div>

  @if (errorMessage()) {
    <div class="bg-red-50 text-red-600 text-sm p-3.5 rounded-xl border border-red-200 mb-6">
      {{ errorMessage() }}
    </div>
  }

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-body flex flex-col gap-4">
    <app-input label="Email Address" placeholder="name@example.com" type="email"
      [error]="getErrorMessage('email')" (valueChange)="loginForm.get('email')?.setValue($event)"></app-input>

    <app-input class="block" label="Password" placeholder="••••••••" type="password"
      [error]="getErrorMessage('password')" (valueChange)="loginForm.get('password')?.setValue($event)"></app-input>

    <div class="flex items-center justify-end">
      <a routerLink="/auth/forgot-password" class="text-xs font-semibold text-indigo-600 hover:text-indigo-700 cursor-pointer">
        Forgot password?
      </a>
    </div>

    <app-button type="submit" [fullWidth]="true" [disabled]="isLoading()" class="mt-2 cursor-pointer">
      {{ isLoading() ? 'Logging in...' : 'Sign In' }}
    </app-button>
  </form>

  <div class="login-footer mt-8 text-center">
    <p class="text-sm text-slate-500">
      Don't have an account?
      <a routerLink="/auth/register" class="text-indigo-600 hover:text-indigo-750 hover:underline font-semibold cursor-pointer">
        Create free account
      </a>
    </p>
  </div>
</div>
